<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - StyliCycle</title>
  <link rel="stylesheet" href="/CSS/style.css">
  
  <!-- ADDED: Inline CSS to fix the chat input layout -->
  <style>
    /* Force the form to be a horizontal row */
    .chat-form {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 10px !important;
      width: 100%;
      margin-top: 15px;
    }

    /* Make the input take up all available space without pushing the button down */
    #chatMessageInput {
      flex: 1 !important;
      width: auto !important;
      margin: 0 !important;
    }

    /* Ensure the green send button is round, doesn't shrink, and aligns perfectly */
    .chat-form button[type="submit"] {
      flex-shrink: 0;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body data-auth-required="true">
  <nav class="top-nav">
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="rental.html">Rentals</a>
      <a href="delivery.html">Delivery</a>
      <a href="chatbox.html" class="active">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-actions">
      <div class="nav-chat-input">
        <input id="navChatInput" type="text" placeholder="Ask chat...">
        <button type="button" id="navChatButton">➤</button>
      </div>
      <button type="button" class="nav-button" id="navNotificationBtn">Notifications</button>
    </div>
  </nav>
  <main class="container chat-layout">
    <aside class="side-panel">
      <h3>Messages</h3>
      <p id="chatPartnersStatus" class="chat-partners-status" role="status" aria-live="polite">Loading conversations...</p>
      <div id="chatPartners" class="chat-partners"></div>
      <div class="notification-list">
        <h4>Recent updates</h4>
        <ul id="chatNotifications"></ul>
      </div>
    </aside>
    <section class="chatbox">
      <div class="chat-header">
        <div class="chat-avatar" id="chatAvatar">SC</div>
        <div class="chat-info">
          <h2 id="chatPartnerName">Select a conversation</h2>
          <span id="chatPartnerContext">Choose a contact to begin chatting</span>
        </div>
        <div class="chat-user-actions">
          <a class="chat-action-button" id="viewProfileButton" hidden>View Profile</a>
        </div>
      </div>
      <div id="chatWindow" class="chat-window" aria-live="polite" aria-relevant="additions text"></div>
      <p id="chatStatus" class="chat-status" role="status" aria-live="polite"></p>
      
      <form id="chatForm" class="chat-form">
        <button id="shareItemButton" type="button" hidden>Send this item</button>
        <input id="chatMessageInput" type="text" maxlength="5000" placeholder="Type a message..." aria-label="Message" required>
        <button type="submit" aria-label="Send message">➤</button>
      </form>
      
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Js/supabase-client.js"></script>
  <script src="/Js/auth.js"></script>
  <script src="/Js/common.js"></script>
  <script src="/Js/chat.js"></script>
</body>
</html>
