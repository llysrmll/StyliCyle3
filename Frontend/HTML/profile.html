<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Profile - StyliCycle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/style.css">
</head>
<body data-auth-required="true">
  <nav class="top-nav">
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="rental.html">Rentals</a>
      <a href="delivery.html">Delivery</a>
      <a href="chatbox.html">Messages</a>
      <a href="profile.html" class="active">Profile</a>
    </div>
    <div class="nav-actions">
      <div class="nav-chat-input">
        <input id="navChatInput" type="text" placeholder="Ask chat...">
        <button type="button" id="navChatButton" aria-label="Open chat">➤</button>
      </div>
      <button type="button" class="nav-button" id="navNotificationBtn">Notifications</button>
    </div>
  </nav>

  <main class="profile-container">
    <p id="profileStatus" class="profile-status profile-page-status" role="status" aria-live="polite"></p>
    <section class="profile-overview" aria-labelledby="vendor-profile-title">
      <h2 class="profile-card-title" id="vendor-profile-title">Vendor Profile</h2>

      <header class="profile-header">
        <img src="/Images/avatar-placeholder.svg" alt="Profile picture" class="profile-photo" id="profileImage">
        <div class="profile-info">
          <p class="eyebrow">Vendor Profile</p>
          <h1 id="profileName">Loading profile...</h1>
          <p class="business-name" id="profileBusiness"></p>
          <p class="contact-line" id="profilePhone"></p>
          <p class="contact-line" id="profileEmail"></p>

          <div class="profile-actions">
            <button type="button" class="btn btn-primary" id="profileEditBtn">Edit Profile</button>
            <button type="button" class="btn btn-outline" id="profileAdminChatBtn">Message Admin</button>
            <a class="btn btn-outline" id="profileMessageBtn" hidden>Message Vendor</a>
            <a class="btn btn-outline" id="profileManageRentalsBtn" href="rental.html">Manage Rentals</a>
          </div>
        </div>
      </header>

      <section class="about-section" aria-labelledby="vendor-about-title">
        <div class="section-heading">
          <h2 id="vendor-about-title">About</h2>
        </div>
        <p class="about-text" id="profileBio"></p>

        <dl class="detail-list">
          <div class="detail-row">
            <dt>Location</dt>
            <dd id="profileLocation">Not provided</dd>
          </div>
          <div class="detail-row">
            <dt>Specialty</dt>
            <dd id="profileSpecialty">Not provided</dd>
          </div>
          <div class="detail-row">
            <dt>Member since</dt>
            <dd id="profileMemberSince">-</dd>
          </div>
        </dl>
      </section>
    </section>

    <section class="portfolio profile-portfolio" aria-labelledby="vendor-portfolio-title">
      <div class="section-heading">
        <h2 id="vendor-portfolio-title">Portfolio</h2>
      </div>
      <p id="portfolioStatus" class="profile-status" role="status" aria-live="polite">Loading your listings...</p>
      <ul class="portfolio-list" id="portfolioList"></ul>
    </section>
  </main>

  <dialog class="profile-edit-dialog" id="profileEditModal" aria-labelledby="profileEditTitle">
    <form id="profileEditForm" class="profile-edit-form">
      <div class="profile-edit-heading">
        <h2 id="profileEditTitle">Edit Profile</h2>
        <button type="button" class="profile-dialog-close" id="profileEditClose" aria-label="Close">×</button>
      </div>
      <label class="field-group">
        <span>Full Name</span>
        <input type="text" name="full_name" id="editFullName" maxlength="160" required>
      </label>
      <label class="field-group">
        <span>Business Name</span>
        <input type="text" name="business_name" id="editBusinessName" maxlength="160">
      </label>
      <label class="field-group">
        <span>Phone</span>
        <input type="tel" name="phone" id="editPhone" maxlength="40">
      </label>
      <label class="field-group">
        <span>Location</span>
        <input type="text" name="location" id="editLocation" maxlength="160">
      </label>
      <label class="field-group">
        <span>Specialty</span>
        <input type="text" name="specialty" id="editSpecialty" maxlength="160">
      </label>
      <label class="field-group">
        <span>Bio</span>
        <textarea name="bio" id="editBio" maxlength="2000" rows="4"></textarea>
      </label>
      <label class="field-group file-field">
        <span>Profile Picture</span>
        <input type="file" name="avatar" id="editAvatar" accept="image/jpeg,image/png,image/webp">
      </label>
      <p id="profileEditStatus" class="profile-status" role="status" aria-live="polite"></p>
      <div class="profile-edit-actions">
        <button type="button" class="btn btn-outline" id="profileEditCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Js/supabase-client.js"></script>
  <script src="/Js/auth.js"></script>
  <script src="/Js/common.js"></script>
  <script src="/Js/profile.js"></script>
</body>
</html>
